name: Package plugin release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check PHP syntax and updater behaviour
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          php tests/updater.php
      - name: Build the tagged version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/build.py --tag "$RELEASE_TAG"
      - name: Attach installable ZIP and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" "dist/jetpack-crm-courses-${VERSION}.zip" dist/jetpack-crm-courses-update.json --clobber
